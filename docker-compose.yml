version: "3.9"

services:
  roadmarkingai:
    build:
      context: .
      dockerfile: Dockerfile
    image: roadmarkingai:latest
    container_name: roadmarkingai
    ports:
      - "8501:8501"
    volumes:
      # Persist user data between runs
      - ./data:/app/data
    environment:
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
